# Perfil de pruebas. La conexión a PostgreSQL la aporta Testcontainers mediante
# @ServiceConnection (ver ContenedoresPrueba); no se definen credenciales aquí.
app:
  cors:
    origenes-permitidos: http://localhost:5173
  jwt:
    # Secreto exclusivo de pruebas automatizadas; no se usa en ningún entorno real.
    secreto: secreto-exclusivo-de-pruebas-automatizadas-0123456789
    expiracion: PT15M
