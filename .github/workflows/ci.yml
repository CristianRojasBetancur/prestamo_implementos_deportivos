name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit, integration, migration and contract tests
        working-directory: apps/backend
        run: mvn -B -ntp clean verify

      - name: Run basic dependency analysis
        working-directory: apps/backend
        run: mvn -B -ntp org.apache.maven.plugins:maven-dependency-plugin:3.8.1:analyze -DfailOnWarning=false

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  docker:
    name: Docker and smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare CI environment
        run: |
          cp .env.example .env
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.env')
          content = path.read_text()
          content = content.replace('DB_CONTRASENA=cambie-esta-contrasena', 'DB_CONTRASENA=ci-local-password')
          content = content.replace('APP_JWT_SECRETO=reemplace-por-un-secreto-aleatorio-de-al-menos-32-bytes', 'APP_JWT_SECRETO=ci-jwt-secret-012345678901234567890123456789')
          path.write_text(content)
          PY

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build backend image from scratch
        run: docker build --no-cache -t prestamo-backend-ci ./apps/backend

      - name: Start Compose stack
        run: docker compose up -d --build --wait

      - name: Run reproducible smoke test
        run: ./scripts/smoke-test.sh

      - name: Verify runtime user is not root
        run: test "$(docker compose exec -T backend id -u)" != "0"

      - name: Verify no local secrets or build artifacts are tracked
        run: |
          tracked_forbidden="$(git ls-files | grep -E '(^|/)(\.env($|\.)|target/|dist/)' | grep -vE '(^|/)\.env\.example$' || true)"
          test -z "$tracked_forbidden" || {
            echo 'Tracked secret or build artifact detected'
            echo "$tracked_forbidden"
            exit 1
          }

      - name: Stop Compose stack
        if: always()
        run: docker compose down -v
